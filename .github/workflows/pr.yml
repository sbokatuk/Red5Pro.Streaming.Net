name: pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: resolve beta version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      internal: ${{ steps.resolve.outputs.internal }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          # Base version lives in Directory.Build.props; the PR number and run number make each
          # published prerelease unique, since nuget.org never allows a version to be reused.
          . ./build/pins.sh
          version="${RED5_VERSION}-beta.${{ github.event.number }}.${{ github.run_number }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Forked pull requests get no access to repository secrets, so the licence and live tiers
          # cannot run there. They still build and run every offline check.
          internal="${{ github.event.pull_request.head.repo.full_name == github.repository }}"
          echo "internal=${internal}" >> "$GITHUB_OUTPUT"

          {
            echo "Building \`${version}\`"
            [ "${internal}" = "true" ] \
              && echo "Licence and live tiers: enabled" \
              || echo "Licence and live tiers: skipped (forked pull request has no secrets)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      run-live-tiers: ${{ needs.version.outputs.internal == 'true' }}
    # The reusable workflow reads RED5_CLOUD_* for the licence and live tiers.
    secrets: inherit

  publish:
    name: publish beta to nuget.org
    needs: [version, build]
    runs-on: ubuntu-latest
    # Forked pull requests get no OIDC token for this repository, so the exchange would fail with a
    # confusing error. Those PRs still build and test; only the publish step is skipped.
    if: needs.version.outputs.internal == 'true'
    # Must match the Environment on the nuget.org trusted publishing policy for this workflow. Note
    # that policies are per workflow file, so this job needs its own policy pointing at pr.yml - the
    # release.yml policy will not match it.
    environment: nuget.org
    permissions:
      contents: read
      # Lets the job request the OIDC token that nuget.org exchanges for a short-lived API key.
      # Without it the token request fails silently and the login step gets no key.
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # Deliberately immediately before the push: the issued key is valid for one hour, and each
      # OIDC token can be exchanged exactly once.
      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          # Symbol packages are pushed automatically alongside each matching .nupkg.
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Summarise
        run: |
          {
            echo "### Published \`${{ needs.version.outputs.version }}\` to nuget.org"
            echo
            for id in Red5Pro.Streaming.Net Red5Pro.Streaming.Net.Maui Red5Pro.Streaming.Net.Android Red5Pro.Streaming.Net.iOS; do
              echo "- [${id}](https://www.nuget.org/packages/${id}/${{ needs.version.outputs.version }})"
            done
            echo
            echo "Remember that these packages do not contain the Red5 SDK - consumers set"
            echo "\`Red5ProAndroidSdk\` / \`Red5ProIosSdk\` to their own licensed copy."
          } >> "$GITHUB_STEP_SUMMARY"
